image:
  repository: ghcr.io/zenmesh/zen-gc-controller
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent

replicas: 1

leaderElection:
  enabled: true

rbac:
  # Explicit allowlist of resource classes the controller may collect
  # (default deny; no wildcards). Grant only what the controller should
  # manage in your deployment.
  targetKinds:
    - group: batch
      resource: jobs
  # true: permissions are namespace-scoped (Role in the release namespace).
  # false: a ClusterRole grants cluster-wide scope.
  namespaceScope: true

networkPolicy:
  enabled: true
  # Minimum egress: Kubernetes API + DNS only.

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits: {}

probes:
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 15

podDisruptionBudget:
  enabled: false
  minAvailable: 1
