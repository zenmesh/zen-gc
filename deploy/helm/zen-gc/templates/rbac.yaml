{{- $kinds := .Values.rbac.targetKinds }}
{{- $scope := .Values.rbac.namespaceScope }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if $scope }}Role{{ else }}ClusterRole{{ end }}
metadata:
  name: {{ .Release.Name }}-zen-gc
  {{- if $scope }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
rules:
  # Policy CRD access (read + status update).
  - apiGroups: ["gc.ops.zen-mesh.io"]
    resources: ["garbagecollectionpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gc.ops.zen-mesh.io"]
    resources: ["garbagecollectionpolicies/status"]
    verbs: ["get", "update", "patch"]
  # Scoped target resource classes (default deny; explicit allowlist).
  {{- range $kinds }}
  - apiGroups: [{{ .group | quote }}]
    resources: [{{ .resource | quote }}]
    verbs: ["get", "list", "watch", "delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if $scope }}RoleBinding{{ else }}ClusterRoleBinding{{ end }}
metadata:
  name: {{ .Release.Name }}-zen-gc
  {{- if $scope }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ if $scope }}Role{{ else }}ClusterRole{{ end }}
  name: {{ .Release.Name }}-zen-gc
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-zen-gc
    namespace: {{ .Release.Namespace }}
