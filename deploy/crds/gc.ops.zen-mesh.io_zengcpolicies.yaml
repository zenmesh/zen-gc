# ZenGCPolicy — Zen-named public API (additive compatibility migration).
#
# The legacy GarbageCollectionPolicy kind (garbagecollectionpolicies.gc.ops.zen-mesh.io)
# REMAINS SERVED and is the execution projection target: the zengcpolicy adapter
# controller mirrors ZenGCPolicy objects 1:1 onto legacy objects, so exactly one
# reconciler executes each logical policy (no double execution by construction).
#
# See docs/COMPATIBILITY.md for the migration contract.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zengcpolicies.gc.ops.zen-mesh.io
spec:
  group: gc.ops.zen-mesh.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - targetResource
                - ttl
              properties:
                targetResource:
                  type: object
                  required:
                    - apiVersion
                    - kind
                  properties:
                    apiVersion:
                      type: string
                    kind:
                      type: string
                ttl:
                  type: object
                  properties:
                    secondsAfterCreation:
                      type: integer
                      minimum: 1
                    fieldPath:
                      type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: zengcpolicies
    singular: zengcpolicy
    kind: ZenGCPolicy
    shortNames:
      - zengc
